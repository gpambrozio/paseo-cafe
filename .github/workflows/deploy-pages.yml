name: Enrich and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Enrich and build static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # configure-pages below reads this repo's Pages settings — and creates
      # the site on a fork that has never deployed one.
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the scan dates each plugin by the commit that added
          # its registry entry (scripts/registry-history.ts), and a shallow
          # clone has no such commit to find.
          fetch-depth: 0

      # Where this deployment actually lives. The canonical site has a custom
      # domain and is served from the root; a fork's project site is served
      # from https://<owner>.github.io/<repo>/. Everything that bakes a URL or
      # a path into the output reads these two outputs — see src/lib/site.ts.
      - name: Resolve this deployment's URL and base path
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan registry
        run: bun run registry:scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify generated site
        run: |
          bun run check:app
          bun run typecheck
          bun run test
          bun run build:generated
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Nitro prerenders each route to its full path, so under a base path the
      # HTML lands in .output/public/<base>/ while the public assets stay at
      # .output/public/. Pages serves the artifact root *as* the base path, so
      # the two have to be merged back together. No-op at the root.
      - name: Merge prerendered pages into the artifact root
        if: steps.pages.outputs.base_path != '/'
        run: |
          set -euo pipefail
          base="${{ steps.pages.outputs.base_path }}"
          cp -R ".output/public${base}/." .output/public/
          rm -rf ".output/public${base}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .output/public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
